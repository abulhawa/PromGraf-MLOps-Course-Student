name: monitoring
services:
  news-classifier-api:
    build: ./src/api
    ports:
      - "8080:8080"
    restart: always

  evaluation:
    build: ./src/evaluation
    depends_on:
      - news-classifier-api

  prometheus:
    image: prom/prometheus:v3.13.5
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: always

volumes:
  prometheus_data: